name: AI-Based Network Intrusion Detection System CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-lint:
    name: Unit Testing & Code Quality Audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out Repository Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11 Runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Project Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Code Quality & Syntax Audit (Flake8)
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
          flake8 . --count --exit-zero --max-complexity=15 --max-line-length=135 --statistics

      - name: Execute Automated Unit & Integration Tests (Pytest)
        run: |
          python -m pytest tests/test_nids.py -v --tb=short

      - name: Verify Algorithmic Self-Test Engine
        run: |
          python test_engine.py

  docker-build-check:
    name: Container Build & Health Validation
    needs: test-and-lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out Repository Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ai-nids-platform:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
