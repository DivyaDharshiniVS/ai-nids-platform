apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-nids-deployment
  labels:
    app: ai-nids-platform
    tier: frontend-backend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: ai-nids-platform
  template:
    metadata:
      labels:
        app: ai-nids-platform
    spec:
      containers:
      - name: nids-app
        image: ai-nids-platform:v1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8501
          name: http-streamlit
        envFrom:
        - configMapRef:
            name: ai-nids-config
        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /_stcore/health
            port: 8501
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /_stcore/health
            port: 8501
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
